name: dart_libp2p_ble
description: >-
  Bluetooth LE transport (/ble) for dart-libp2p: phones and Macs nearby
  connect without a network, with Noise and yamux over GATT.
version: 0.1.0
repository: https://github.com/stephanfeb/dart-libp2p-ble
issue_tracker: https://github.com/stephanfeb/dart-libp2p-ble/issues
topics: [libp2p, bluetooth, ble, p2p, networking]

platforms:
  android:
  ios:
  macos:

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  bluetooth_low_energy: ^6.2.1
  dart_libp2p: ^4.10.0
  flutter:
    sdk: flutter
  logging: ^1.3.0

dev_dependencies:
  dart_libp2p_pubsub: ^3.1.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
